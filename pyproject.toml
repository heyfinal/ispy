[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ispy-ios"
version = "2.0.0"
description = "Advanced iOS Diagnostic & Management Tool with AI Integration"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Daniel", email = "daniel@example.com"}
]
keywords = ["ios", "diagnostic", "apple", "iphone", "forensics", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Diagnostics",
    "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "click>=8.0.0",
    "openai>=1.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
forensics = [
    "biplist>=1.0.3",
    "pycryptodome>=3.19.0",
    "pandas>=2.0.0",
]
pdf = [
    "jinja2>=3.1.0",
    "weasyprint>=60.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]
all = [
    "ispy-ios[forensics,pdf,dev]",
]

[project.scripts]
ispy = "ispy.cli:main"

[project.urls]
Homepage = "https://github.com/heyfinal/ispy"
Documentation = "https://github.com/heyfinal/ispy#readme"
Repository = "https://github.com/heyfinal/ispy.git"
Issues = "https://github.com/heyfinal/ispy/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
